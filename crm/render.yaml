services:
  - type: web
    name: walktheplan-crm-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix backend --legacy-peer-deps
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CRM_PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

